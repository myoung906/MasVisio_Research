<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shell Gap</title>
<style>
:root{
  /* ground: slate with a cool bias, chosen to sit under a diverging data scale */
  --bg:#f4f6f8; --panel:#ffffff; --ink:#111a24; --muted:#5c6b7f; --line:#dde3ea;
  /* UI accent — deliberately not blue, because blue means "myopic" in the data */
  --accent:#2d7d78;
  /* categorical: the two image shells */
  --tan:#7c3aed; --sag:#0e7490;
  /* diverging semantic: sign of the dioptric error */
  --hyper:#c2410c; --myo:#1d4ed8;
  --ok:#2d7d78; --alert:#b45309;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d131c; --panel:#161e2b; --ink:#e6ecf4; --muted:#93a3b8; --line:#27313f;
    --accent:#5eb8b0; --tan:#a78bfa; --sag:#38bdf8;
    --hyper:#fb923c; --myo:#7aa2ff; --ok:#5eb8b0; --alert:#f0b357;
  }
}
:root[data-theme="dark"]{
  --bg:#0d131c; --panel:#161e2b; --ink:#e6ecf4; --muted:#93a3b8; --line:#27313f;
  --accent:#5eb8b0; --tan:#a78bfa; --sag:#38bdf8;
  --hyper:#fb923c; --myo:#7aa2ff; --ok:#5eb8b0; --alert:#f0b357;
}
*{box-sizing:border-box}
:root{--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:14px;margin:0 0 10px;letter-spacing:.01em}
canvas{width:100%;display:block;border-radius:6px;touch-action:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12px;
  font-variant-numeric:tabular-nums;font-family:var(--mono)}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--mono);letter-spacing:-.01em}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.flag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;
  border:1px solid var(--line);color:var(--alert);margin-right:6px}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>망막 프로파일 리뷰 — <span id="label"></span></h1>
  <div class="sub" id="sub"></div>

  <div class="card" style="margin-bottom:16px">
    <div class="kpis" id="kpis"></div>
    <div class="note" id="limits"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>3D 구조 — 망막면과 상면</h2>
      <div class="row">
        <button id="bT" class="on">접선 상면</button>
        <button id="bS" class="on">시상 상면</button>
        <button id="bR" class="on">망막면</button>
        <button id="bSpin">자동회전</button>
        <button id="bReset">시점 초기화</button>
      </div>
      <canvas id="c3d" height="420" style="height: 420px;"></canvas>
      <div class="note">드래그=회전 · 휠=확대. 망막면 색은 RPRE(<span style="color:var(--hyper)">따뜻함=원시성(+)</span> / <span style="color:var(--myo)">차가움=근시성(−)</span>).</div>
    </div>

    <div class="card">
      <h2>RPRE · 난시 프로파일</h2>
      <canvas id="cprof" height="420" style="height: 420px;"></canvas>
      <div class="note">RPRE = M(θ) − M(0). J0는 접선−시상 반차(자오면 규약).</div>
    </div>

    <div class="card">
      <h2>자오면 광선 스케치</h2>
      <div class="row" id="skbtns"></div>
      <canvas id="csk" height="330" style="height: 330px;"></canvas>
      <div class="note" id="sknote"></div>
    </div>

    <div class="card">
      <h2>수치</h2>
      <div class="scroll"><table id="tbl"></table></div>
    </div>
  </div>
</div>

/* ---------- helpers ---------- */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fit(cv){
  const r = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = parseInt(cv.getAttribute('height'),10);
  cv.width = w*r; cv.height = h*r;
  const g = cv.getContext('2d'); g.setTransform(r,0,0,r,0,0);
  return {g,w,h};
}
const fmt = (v,n=3) => (v>=0?'+':'') + v.toFixed(n);

/* ---------- header ---------- */
document.getElementById('label').textContent = D.label;
document.getElementById('sub').textContent =
  `AL ${D.biometry.axial_length_mm.toFixed(2)} mm · 각막 R ${D.biometry.cornea_r_ant_mm.toFixed(2)} mm / Q ${D.biometry.cornea_q_ant.toFixed(2)}`

const outer = D.profile[D.profile.length-1];
const kpi = [

  ['축상 굴절 M(0)', fmt(D.profile[0].m,2)+' D'],
  ['RPRE @'+outer.ecc+'°', fmt(outer.rpre,2)+' D'],
  ['J0 @'+outer.ecc+'°', fmt(outer.j0,2)+' D'],
  ['dD/dz', D.paraxial.d_per_mm.toFixed(2)+' D/mm'],

document.getElementById('kpis').innerHTML = kpi.map(k =>
  `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('');

const L = D.limits;
document.getElementById('limits').innerHTML =
  (L.rotationally_symmetric ? '<span class="flag">회전대칭 모델 — 경선차는 망막 형상에서만</span>' : '')

  + `<span class="flag">망막: ${L.retina_source}</span>`;

/* ---------- 3D ---------- */
const c3 = document.getElementById('c3d');
let rot = {x:-0.35, y:0.65}, zoom = 1, spin = false;
const show = {T:true, S:true, R:true};

function imageShellPoint(ring, i, which){
  // Focus position along the chief ray: retina point displaced by the dioptric
  // error converted back to millimetres. Sign matches "negative = myopic".
  const p = ring.points[i].p;
  const row = D.profile[i];
  const d = which==='T' ? row.tangential : row.sagittal;
  const gap = -d / D.paraxial.d_per_mm;           // mm, +ve = focus before retina
  const n = Math.hypot(p[0],p[1],p[2]-0) || 1;
  const dir = [p[0]/n, p[1]/n, p[2]/n];
  return [p[0]-dir[0]*gap, p[1]-dir[1]*gap, p[2]-dir[2]*gap];
}

function project(pt, w, h){
  const cx=Math.cos(rot.x), sx=Math.sin(rot.x), cy=Math.cos(rot.y), sy=Math.sin(rot.y);
  let [x,y,z] = pt; z -= 14;                       // centre the eye
  let x1 = x*cy + z*sy,  z1 = -x*sy + z*cy;
  let y1 = y*cx - z1*sx, z2 =  y*sx + z1*cx;
  const s = 13 * zoom * (1 + z2/900);
  return [w/2 + x1*s, h/2 - y1*s, z2];
}

function rpreColour(v){
  const t = Math.max(-1, Math.min(1, v/1.5));
  // Diverging on the sign of the error: warm = hyperopic, cool = myopic.
  return t >= 0
    ? `rgba(194,65,12,${0.22+0.58*t})`
    : `rgba(29,78,216,${0.22+0.58*(-t)})`;
}

function draw3d(){
  const {g,w,h} = fit(c3);
  g.clearRect(0,0,w,h);
  g.fillStyle = css('--bg'); g.fillRect(0,0,w,h);

  // optical axis
  const a0 = project([0,0,0],w,h), a1 = project([0,0,D.biometry.axial_length_mm],w,h);
  g.strokeStyle = css('--line'); g.lineWidth = 1; g.setLineDash([5,4]);
  g.beginPath(); g.moveTo(a0[0],a0[1]); g.lineTo(a1[0],a1[1]); g.stroke(); g.setLineDash([]);

  // retinal shell: quads between adjacent meridians, coloured by RPRE
  if(show.R){
    for(let m=0;m<D.shell.length;m++){
      const A = D.shell[m], B = D.shell[(m+1)%D.shell.length];
      for(let i=0;i<A.points.length-1;i++){
        const q = [A.points[i].p, A.points[i+1].p, B.points[i+1].p, B.points[i].p]
          .map(p=>project(p,w,h));
        g.beginPath(); g.moveTo(q[0][0],q[0][1]);
        for(let k=1;k<4;k++) g.lineTo(q[k][0],q[k][1]);
        g.closePath();
        g.fillStyle = rpreColour((A.points[i+1].rpre + B.points[i+1].rpre)/2);
        g.fill();
        g.strokeStyle = css('--line'); g.lineWidth = .5; g.stroke();
      }
    }
  }

  // image shells as rings
  for(const which of ['T','S']){
    if(!show[which]) continue;
    g.strokeStyle = which==='T' ? css('--tan') : css('--sag');
    g.lineWidth = 1.6;
    for(let i=1;i<D.profile.length;i++){
      g.beginPath();
      for(let m=0;m<=D.shell.length;m++){
        const ring = D.shell[m % D.shell.length];
        const p = project(imageShellPoint(ring,i,which),w,h);
        m===0 ? g.moveTo(p[0],p[1]) : g.lineTo(p[0],p[1]);
      }
      g.closePath(); g.stroke();
    }
  }

  g.font='12px ui-sans-serif,system-ui,sans-serif';
  const legend = [['망막면 — 색 = RPRE', css('--muted')],
                  ['접선 상면 (T)', css('--tan')], ['시상 상면 (S)', css('--sag')]];
  legend.forEach((l,i)=>{ g.fillStyle=l[1]; g.fillText(l[0], 12, 18+i*16); });
}

(function bind3d(){
  let drag=false, lx=0, ly=0;
  c3.addEventListener('pointerdown', e=>{drag=true;lx=e.clientX;ly=e.clientY;c3.setPointerCapture(e.pointerId);});
  c3.addEventListener('pointermove', e=>{
    if(!drag) return;
    rot.y += (e.clientX-lx)*0.01; rot.x += (e.clientY-ly)*0.01;
    rot.x = Math.max(-1.5, Math.min(1.5, rot.x));
    lx=e.clientX; ly=e.clientY; draw3d();
  });
  c3.addEventListener('pointerup', e=>{drag=false;});
  c3.addEventListener('wheel', e=>{e.preventDefault(); zoom *= e.deltaY>0?0.92:1.08;
    zoom=Math.max(.4,Math.min(4,zoom)); draw3d();}, {passive:false});
  const tog=(id,key)=>document.getElementById(id).addEventListener('click',ev=>{
    show[key]=!show[key]; ev.target.classList.toggle('on',show[key]); draw3d();});
  tog('bT','T'); tog('bS','S'); tog('bR','R');
  document.getElementById('bSpin').addEventListener('click',ev=>{
    spin=!spin; ev.target.classList.toggle('on',spin); if(spin) tick();});
  document.getElementById('bReset').addEventListener('click',()=>{
    rot={x:-0.35,y:0.65}; zoom=1; draw3d();});
  function tick(){ if(!spin) return; rot.y += 0.006; draw3d(); requestAnimationFrame(tick); }
})();

/* ---------- profile chart ---------- */
function drawProfile(){
  const {g,w,h} = fit(document.getElementById('cprof'));
  g.clearRect(0,0,w,h); g.fillStyle=css('--bg'); g.fillRect(0,0,w,h);
  const pad={l:46,r:14,t:14,b:34};
  const xs = D.profile.map(p=>p.ecc);
  const series = [['rpre','RPRE (M−M0)',css('--accent')],
                  ['j0','J0',css('--tan')],
                  ['m','M',css('--muted')]];
  let lo=0, hi=0;
  series.forEach(s=>D.profile.forEach(p=>{lo=Math.min(lo,p[s[0]]);hi=Math.max(hi,p[s[0]]);}));
  const span = Math.max(0.6, hi-lo); lo-=span*0.12; hi+=span*0.12;
  const X = v => pad.l + (v-xs[0])/(xs[xs.length-1]-xs[0]) * (w-pad.l-pad.r);
  const Y = v => h-pad.b - (v-lo)/(hi-lo) * (h-pad.t-pad.b);

  g.strokeStyle=css('--line'); g.lineWidth=1;
  g.beginPath(); g.moveTo(pad.l,Y(0)); g.lineTo(w-pad.r,Y(0)); g.stroke();
  g.fillStyle=css('--muted'); g.font='11px ui-sans-serif,system-ui,sans-serif';
  xs.forEach(v=>{ g.fillText(v+'°', X(v)-8, h-pad.b+16); });
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4;
    g.fillText(fmt(v,1), 6, Y(v)+4);
    g.strokeStyle=css('--line'); g.beginPath(); g.moveTo(pad.l,Y(v)); g.lineTo(w-pad.r,Y(v)); g.stroke(); }

  series.forEach((s,si)=>{
    g.strokeStyle=s[2]; g.lineWidth=si===0?2.4:1.6; g.beginPath();
    D.profile.forEach((p,i)=>{ const x=X(p.ecc), y=Y(p[s[0]]); i?g.lineTo(x,y):g.moveTo(x,y); });
    g.stroke();
    D.profile.forEach(p=>{ g.fillStyle=s[2]; g.beginPath(); g.arc(X(p.ecc),Y(p[s[0]]),2.6,0,7); g.fill(); });
    g.fillStyle=s[2]; g.fillText(s[1], w-pad.r-96, pad.t+12+si*15);
  });
}

/* ---------- meridional sketch ---------- */
const skKeys = Object.keys(D.sketches);
let skSel = skKeys[skKeys.length-1];
document.getElementById('skbtns').innerHTML = skKeys.map(k=>
  `<button data-k="${k}" class="${k===skSel?'on':''}">${k}°</button>`).join('');
document.getElementById('skbtns').addEventListener('click',e=>{
  if(!e.target.dataset.k) return;
  skSel = e.target.dataset.k;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle('on', b.dataset.k===skSel));
  drawSketch();
});

function drawSketch(){
  const S = D.sketches[skSel];
  const {g,w,h} = fit(document.getElementById('csk'));
  g.clearRect(0,0,w,h); g.fillStyle=css('--bg'); g.fillRect(0,0,w,h);
  let zmin=1e9,zmax=-1e9,xmin=1e9,xmax=-1e9;
  S.rays.forEach(r=>r.forEach(p=>{zmin=Math.min(zmin,p[0]);zmax=Math.max(zmax,p[0]);
    xmin=Math.min(xmin,p[1]);xmax=Math.max(xmax,p[1]);}));
  const pad=16, sc=Math.min((w-2*pad)/(zmax-zmin),(h-2*pad)/Math.max(xmax-xmin,1));
  const P=(z,x)=>[pad+(z-zmin)*sc, h/2-(x-(xmin+xmax)/2)*sc];
  const cols=['#0b6fb8','#1a8a5a','#b8560b','#8a2ea0','#b81b3c'];
  S.rays.forEach((r,i)=>{
    g.strokeStyle=cols[i%cols.length]; g.lineWidth=1.3; g.beginPath();
    r.forEach((p,k)=>{const q=P(p[0],p[1]); k?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);}); g.stroke();
  });
  const f=P(S.focus[0],S.focus[1]), rr=P(S.retina_hit[0],S.retina_hit[1]);
  g.strokeStyle=css('--hyper'); g.lineWidth=2;
  g.beginPath(); g.moveTo(f[0],f[1]); g.lineTo(rr[0],rr[1]); g.stroke();
  g.fillStyle=css('--hyper'); g.beginPath(); g.arc(f[0],f[1],4,0,7); g.fill();
  g.strokeStyle=css('--ink'); g.lineWidth=2;
  g.beginPath(); g.arc(rr[0],rr[1],4,0,7); g.stroke();
  document.getElementById('sknote').textContent =
    `입사 ${skSel}° · 초점→망막 ${fmt(S.gap_mm,3)} mm = ${fmt(S.defocus_d,3)} D`;
}

/* ---------- table ---------- */
document.getElementById('tbl').innerHTML =
  '<thead><tr><th>편심</th><th>접선 T</th><th>시상 S</th><th>M</th><th>J0</th><th>RPRE</th></tr></thead><tbody>'
  + D.profile.map(p=>`<tr><td>${p.ecc}°</td><td>${fmt(p.tangential)}</td><td>${fmt(p.sagittal)}</td>`
    + `<td>${fmt(p.m)}</td><td>${fmt(p.j0)}</td><td><b>${fmt(p.rpre)}</b></td></tr>`).join('')
  + '</tbody>';

function redraw(){ draw3d(); drawProfile(); drawSketch(); }
window.addEventListener('resize', redraw);
redraw();
</script>

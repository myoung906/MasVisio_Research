<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>망막 프로파일 리뷰 v2 — Shell Gap</title>
<style>
:root{
  --bg:#090d16; --panel:#131b2e; --panelglass:rgba(19, 27, 46, 0.7); --ink:#f1f5f9; --muted:#64748b; --line:#1e293b;
  --accent:#38bdf8; --accentglow:rgba(56, 189, 248, 0.12); --accentgradient:linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
  --tan:#a78bfa; --sag:#06b6d4; --hyper:#f97316; --myo:#3b82f6; --ok:#10b981; --alert:#f59e0b;
  --cardshadow:0 10px 30px -10px rgba(0, 0, 0, 0.4); --glassborder:rgba(255, 255, 255, 0.05);
}
:root[data-theme="light"]{
  --bg:#f8fafc; --panel:#ffffff; --panelglass:rgba(255, 255, 255, 0.8); --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#0284c7; --accentglow:rgba(2, 132, 199, 0.06); --accentgradient:linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%);
  --tan:#7c3aed; --sag:#0891b2; --hyper:#ea580c; --myo:#2563eb; --ok:#059669; --alert:#d97706;
  --cardshadow:0 10px 25px -12px rgba(15, 23, 42, 0.08); --glassborder:rgba(15, 23, 42, 0.04);
}
*{box-sizing:border-box;transition:background-color 0.25s,border-color 0.25s}
:root{--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Outfit","Noto Sans KR",ui-sans-serif,system-ui,-apple-system,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1380px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:16px}
.header-left h1{font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:-0.02em;background:var(--accentgradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-left .sub{color:var(--muted);font-size:14px}
.theme-toggle{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:var(--cardshadow)}
.theme-toggle:hover{border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--cardshadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accentgradient);opacity:0.7}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px}
.kpi .v{font-size:22px;font-weight:700;font-family:var(--mono);letter-spacing:-0.02em}
.flags-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.flag{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.flag.alert{color:var(--alert);border-color:rgba(245, 158, 11, 0.3);background:rgba(245, 158, 11, 0.05)}
.flag.ok{color:var(--ok);border-color:rgba(16, 185, 129, 0.3);background:rgba(16, 185, 129, 0.05)}
.flag.info{color:var(--accent);border-color:rgba(56, 189, 248, 0.3);background:rgba(56, 189, 248, 0.05)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:1080px){.grid{grid-template-columns:1fr}}
.card{background:var(--panelglass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glassborder);border-radius:18px;padding:20px;box-shadow:var(--cardshadow);display:flex;flex-direction:column}
.card h2{font-size:16px;font-weight:600;margin:0 0 16px;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;border-left:3px solid var(--accent);padding-left:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
button,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;font-family:inherit}
button:hover{border-color:var(--accent);background:var(--line)}
button.on{background:var(--accent);color:#090d16;border-color:var(--accent);font-weight:600;box-shadow:0 0 12px var(--accentglow)}
canvas{width:100%;display:block;border-radius:12px;background:var(--bg);border:1px solid var(--line);touch-action:none}
.card .note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.4}
.scroll{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--mono)}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{background:rgba(0,0,0,0.15);color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.05em}
tbody tr:hover{background:rgba(255,255,255,0.02)}
tbody tr:last-child td{border-bottom:none}
.literature-section{grid-column:1 / -1;margin-top:24px}
.literature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.lit-card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;justify-content:space-between}
.lit-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(56, 189, 248, 0.2)}
.lit-card.active{border-color:var(--accent);background:rgba(56, 189, 248, 0.03)}
.lit-title{font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.4;color:var(--ink)}
.lit-authors{font-size:12px;color:var(--muted);margin-bottom:8px}
.lit-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.lit-citations{background:var(--accentglow);color:var(--accent);padding:2px 6px;border-radius:6px;font-weight:600}
.lit-detail-panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px;display:none;border-left:4px solid var(--accent)}
.lit-detail-panel h3{margin:0 0 10px;font-size:16px;font-weight:600}
.lit-detail-authors{font-size:13px;color:var(--muted);margin-bottom:12px}
.lit-detail-journal{font-style:italic;font-size:12px;color:var(--muted);margin-bottom:16px}
.lit-detail-abstract{font-size:13px;line-height:1.6;margin-bottom:16px;color:rgba(241,245,249,0.8)}
:root[data-theme="light"] .lit-detail-abstract{color:rgba(15,23,42,0.8)}
.lit-link-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accentgradient);color:#090d16;padding:8px 16px;border-radius:8px;font-weight:600;font-size:12px;text-decoration:none}
.lit-link-btn:hover{opacity:0.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <h1>망막 프로파일 리뷰 v2 — <span id="label"></span></h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="theme-toggle" id="themeBtn">
      <span id="themeIcon">☀️</span> <span id="themeText">Light Mode</span>
    </button>
  </header>

  <div class="kpis" id="kpis"></div>
  
  <div class="flags-bar" id="limits"></div>

  <div class="grid">
    <div class="card">
      <h2>3D 구조 — 망막면과 상면</h2>
      <div class="row">
        <button id="bT" class="on">접선 상면</button>
        <button id="bS" class="on">시상 상면</button>
        <button id="bR" class="on">망막면</button>
        <button id="bSpin">자동회전</button>
        <button id="bReset">시점 초기화</button>
      </div>
      <canvas id="c3d" height="420" style="height: 420px;"></canvas>
      <div class="note">드래그=회전 · 휠=확대. 망막면 색은 RPRE(<span style="color:var(--hyper)">따뜻함=원시성(+)</span> / <span style="color:var(--myo)">차가움=근시성(−)</span>). 3D 조명 음영 처리 활성화됨.</div>
    </div>

    <div class="card">
      <h2>RPRE · 난시 프로파일</h2>
      <canvas id="cprof" height="420" style="height: 420px;"></canvas>
      <div class="note">RPRE = M(θ) − M(0). J0는 접선−시상 반차. 마우스를 올려 정확한 수치와 <b>Navarro 1999 정시안 레퍼런스</b>를 비교해보세요.</div>
    </div>

    <div class="card">
      <h2>자오면 광선 스케치</h2>
      <div class="row" id="skbtns"></div>
      <canvas id="csk" height="360" style="height: 360px;"></canvas>
      <div class="note" id="sknote"></div>
    </div>

    <div class="card">
      <h2>수치</h2>
      <div class="scroll"><table id="tbl"></table></div>
    </div>

    <!-- Scientific Literature Section -->
    <div class="card literature-section">
      <h2>학술 연구 및 임상 문헌 (OpenAlex 연동)</h2>
      <div class="literature-grid" id="litGrid"></div>
      <div class="lit-detail-panel" id="litDetail">
        <h3 id="litDetailTitle"></h3>
        <div class="lit-detail-authors" id="litDetailAuthors"></div>
        <div class="lit-detail-journal" id="litDetailJournal"></div>
        <div class="lit-detail-abstract" id="litDetailAbstract"></div>
        <a class="lit-link-btn" id="litDetailLink" target="_blank">
          <span>DOI 논문 링크 보기</span> ↗
        </a>
      </div>
    </div>
  </div>
</div>

surface. Seidel aberrations (spherical aberration, coma, astigmatism, field curvature, and distortion), longitudinal and transverse chromatic aberrations, and overall monochromatic spot diagrams have been computed for this eye model and for field angles ranging from 0 degree to 60 degrees by both finite and third-order ray tracing. The modulation transfer function for each field angle has been computed as well. In each case our results have been compared with average experimental data found in the literature, showing a reasonably good agreement. The agreement between the model and experimental data is better off axis, mainly at moderate (10 degrees-40 degrees) field angles, than on axis. The model has been applied to simulate a variety of experimental methods in which image aberrations are estimated from measurements taken in the object space. Our results suggest that for some types of aberration, these methods may yield biased estimates.", "desc": "Defines the Escudero-Sanz & Navarro wide-angle schematic eye model, which is used for off-axis aberration and raytracing validation."}, "navarro_2007": {"title": "Wide-field schematic eye models with gradient-index lens", "authors": ["Alexander V. Goncharov", "Chris Dainty"], "year": 2007, "citations": 169, "doi": "https://doi.org/10.1364/josaa.24.002157", "journal": "Journal of the Optical Society of America A", "abstract": "We propose a wide-field schematic eye model, which provides a more realistic description of the optical system of the eye in relation to its anatomical structure. The wide-field model incorporates a gradient-index (GRIN) lens, which enables it to fulfill properties of two well-known schematic eye models, namely, Navarro's model for off-axis aberrations and Thibos's chromatic on-axis model (the Indiana eye). These two models are based on extensive experimental data, which makes the derived wide-field eye model also consistent with that data. A mathematical method to construct a GRIN lens with its iso-indicial contours following the optical surfaces of given asphericity is presented. The efficiency of the method is demonstrated with three variants related to different age groups. The role of the GRIN structure in relation to the lens paradox is analyzed. The wide-field model with a GRIN lens can be used as a starting design for the eye inverse problem, i.e., reconstructing the optical structure of the eye from off-axis wavefront measurements. Anatomically more accurate age-dependent optical models of the eye could ultimately help an optical designer to improve wide-field retinal imaging.", "desc": "Introduces the GRIN (gradient-index) wide-field eye model. Explains the optical implications of GRIN vs homogeneous lenses in peripheral refraction."}, "working_distance_oct_2024": {"title": "Critical Impact of Working Distance on OCT Imaging: Correction of Optical Distortion and Its Effects on Measuring Retinal Curvature", "authors": ["Yong Woo Kim", "Glen P. Sharpe", "Julia Siber", "Ralf Keßler", "Jörg Fischer", "Tilman Otto", "Balwantray C. Chauhan"], "year": 2024, "citations": 4, "doi": "https://doi.org/10.1167/iovs.65.12.10", "journal": "Investigative Ophthalmology & Visual Science", "abstract": "Purpose: To assess the impact of working distance (WD) on optical distortion in optical coherence tomography (OCT) imaging and to evaluate the effectiveness of optical distortion correction in achieving consistent retinal Bruch's membrane (BM) layer curvature, regardless of variations in WD. Methods: Ten subjects underwent OCT imaging with four serial macular volume scans, each employing distinct WD settings adjusted by balancing the sample and reference arm of the OCT interferometer (eye length settings changed). Either of two types of 30° standard objectives (SOs) was used. A ray tracing model was used to correct optical distortion, and BM layer curvature (represented as the second derivative of the curve) was measured. Linear mixed effects (LME) modeling was used to analyze factors associated with BM layer curvature, both before and after distortion correction. Results: WD exhibited significant associations with axial length (β = -1.35, P < 0.001), SO type (P < 0.001), and eye length settings (P < 0.001). After optical distortion correction, the mean ± SD BM layer curvature significantly increased from 16.80 ± 10.08 µm-1 to 49.31 ± 7.50 µm-1 (P < 0.001). The LME model showed a significant positive association between BM layer curvature and WD (β = 1.94, P < 0.001). After distortion correction, the percentage change in BM layer curvature due to a 1-mm WD alteration decreased from 9.75% to 0.25%. Conclusions: Correcting optical distortion in OCT imaging significantly mitigates the influence of WD on BM layer curvature, enabling a more accurate analysis of posterior eye morphology, especially when variations in WD are unavoidable.", "desc": "Demonstrates the critical impact of working distance on OCT scans and proposes dewarping corrections using ray-tracing."}, "posterior_eye_shape_mri_oct": {"title": "Posterior Eye Shape Measurement With Retinal OCT Compared to MRI", "authors": ["Anthony N. Kuo", "Pavan K. Verkicharla", "Ryan P. McNabb", "Carol Y. Cheung", "Saima Hilal", "Sina Farsiu", "Christopher Chen", "Tien Yin Wong", "M. Kamran Ikram", "Ching‐Yu Cheng", "Terri L. Young", "Seang‐Mei Saw", "Joseph A. Izatt"], "year": 2016, "citations": 66, "doi": "https://doi.org/10.1167/iovs.15-18886", "journal": "Investigative Ophthalmology & Visual Science", "abstract": "PURPOSE: Posterior eye shape assessment by magnetic resonance imaging (MRI) is used to study myopia. We tested the hypothesis that optical coherence tomography (OCT), as an alternative, could measure posterior eye shape similarly to MRI. METHODS: Macular spectral-domain OCT and brain MRI images previously acquired as part of the Singapore Epidemiology of Eye Diseases study were analyzed. The right eye in the MRI and OCT images was automatically segmented. Optical coherence tomography segmentations were corrected for optical and display distortions requiring biometry data. The segmentations were fitted to spheres and ellipsoids to obtain the posterior eye radius of curvature (Rc) and asphericity (Qxz). The differences in Rc and Qxz measured by MRI and OCT were tested using paired t-tests. Categorical assignments of prolateness or oblateness using Qxz were compared. RESULTS: Fifty-two subjects (67.8 ± 5.6 years old) with spherical equivalent refraction from +0.50 to -5.38 were included. The mean paired difference between MRI and original OCT posterior eye Rc was 24.03 ± 46.49 mm (P = 0.0005). For corrected OCT images, the difference in Rc decreased to -0.23 ± 2.47 mm (P = 0.51). The difference between MRI and OCT asphericity, Qxz, was -0.052 ± 0.343 (P = 0.28). However, categorical agreement was only moderate (κ = 0.50). CONCLUSIONS: Distortion-corrected OCT measurements of Rc and Qxz were not statistically significantly different from MRI, although the moderate categorical agreement suggests that individual differences remained. This study provides evidence that with distortion correction, noninvasive office-based OCT could potentially be used instead of MRI for the study of posterior eye shape.", "desc": "Validates distortion-corrected OCT posterior eye curvature measurements against gold-standard MRI shapes."}, "peripheral_refraction_myopia": {"title": "IMI – Defining and Classifying Myopia: A Proposed Set of Standards for Clinical and Epidemiologic Studies", "authors": ["Daniel Ian Flitcroft", "Mingguang He", "Jost B. Jonas", "Monica Jong", "Kovin Naidoo", "Kyoko Ohno‐Matsui", "Jugnoo S. Rahi", "Serge Resnikoff", "Susan Vitale", "Lawrence A. Yannuzzi"], "year": 2019, "citations": 1121, "doi": "https://doi.org/10.1167/iovs.18-25957", "journal": "Investigative Ophthalmology & Visual Science", "abstract": "Purpose: We provide a standardized set of terminology, definitions, and thresholds of myopia and its main ocular complications. Methods: Critical review of current terminology and choice of myopia thresholds was done to ensure that the proposed standards are appropriate for clinical research purposes, relevant to the underlying biology of myopia, acceptable to researchers in the field, and useful for developing health policy. Results: We recommend that the many descriptive terms of myopia be consolidated into the following descriptive categories: myopia, secondary myopia, axial myopia, and refractive myopia. To provide a framework for research into myopia prevention, the condition of \"pre-myopia\" is defined. As a quantitative trait, we recommend that myopia be divided into myopia (i.e., all myopia), low myopia, and high myopia. The current consensus threshold value for myopia is a spherical equivalent refractive error ≤ -0.50 diopters (D), but this carries significant risks of classification bias. The current consensus threshold value for high myopia is a spherical equivalent refractive error ≤ -6.00 D. \"Pathologic myopia\" is proposed as the categorical term for the adverse, structural complications of myopia. A clinical classification is proposed to encompass the scope of such structural complications. Conclusions: Standardized definitions and consistent choice of thresholds are essential elements of evidence-based medicine. It is hoped that these proposals, or derivations from them, will facilitate rigorous, evidence-based approaches to the study and management of myopia.", "desc": "Reviews the clinical role of relative peripheral refractive error (RPRE) and astigmatism in myopia control and lens design."}}, "limits": {"rotationally_symmetric": true, "fan_distortion_corrected": false, "retina_source": "measured contour"}};

/* ---------- Theme Handling ---------- */
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const themeText = document.getElementById('themeText');

function setTheme(dark, shouldRedraw = true) {
  if (dark) {
    document.documentElement.removeAttribute('data-theme');
    themeIcon.textContent = '☀️';
    themeText.textContent = 'Light Mode';
    localStorage.setItem('theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    themeIcon.textContent = '🌙';
    themeText.textContent = 'Dark Mode';
    localStorage.setItem('theme', 'light');
  }
  if (shouldRedraw && typeof redraw === 'function') {
    redraw();
  }
}

themeBtn.addEventListener('click', () => {
  const isDark = !document.documentElement.hasAttribute('data-theme');
  setTheme(!isDark, true);
});

// Init theme
const savedTheme = localStorage.getItem('theme') || 'dark';
setTheme(savedTheme === 'dark', false);

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fit(cv){
  const r = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = parseInt(cv.getAttribute('height'),10);
  cv.width = w*r; cv.height = h*r;
  const g = cv.getContext('2d'); g.setTransform(r,0,0,r,0,0);
  return {g,w,h};
}
const fmt = (v,n=3) => (v>=0?'+':'') + v.toFixed(n);

/* ---------- 3D ---------- */
const c3 = document.getElementById('c3d');
let rot = {x:-0.35, y:0.65}, zoom = 1, spin = false;
const show = {T:true, S:true, R:true};

function imageShellPoint(ring, i, which){
  const p = ring.points[i].p;
  const row = D.profile[i];
  const d = which==='T' ? row.tangential : row.sagittal;
  const gap = -d / D.paraxial.d_per_mm;
  const n = Math.hypot(p[0],p[1],p[2]-0) || 1;
  const dir = [p[0]/n, p[1]/n, p[2]/n];
  return [p[0]-dir[0]*gap, p[1]-dir[1]*gap, p[2]-dir[2]*gap];
}

function project(pt, w, h){
  const cx=Math.cos(rot.x), sx=Math.sin(rot.x), cy=Math.cos(rot.y), sy=Math.sin(rot.y);
  let [x,y,z] = pt; z -= 14;
  let x1 = x*cy + z*sy,  z1 = -x*sy + z*cy;
  let y1 = y*cx - z1*sx, z2 =  y*sx + z1*cx;
  const s = 13 * zoom * (1 + z2/900);
  return [w/2 + x1*s, h/2 - y1*s, z2];
}

// 3D Shading Normal Vector Calculation
function computeShading(q, lightDir=[0.3, 0.5, 0.8]) {
  const ux = q[1][0] - q[0][0], uy = q[1][1] - q[0][1], uz = q[1][2] - q[0][2];
  const vx = q[2][0] - q[0][0], vy = q[2][1] - q[0][1], vz = q[2][2] - q[0][2];
  let nx = uy * vz - uz * vy;
  let ny = uz * vx - ux * vz;
  let nz = ux * vy - uy * vx;
  const len = Math.hypot(nx, ny, nz) || 1;
  nx /= len; ny /= len; nz /= len;
  
  const lLen = Math.hypot(...lightDir) || 1;
  const dot = (nx * lightDir[0] + ny * lightDir[1] + nz * lightDir[2]) / lLen;
  return 0.65 + 0.35 * Math.max(0, dot);
}

function rpreColour(v, shade=1.0){
  const t = Math.max(-1, Math.min(1, v/1.5));
  if (t >= 0) {
    const r = Math.round(249 * shade);
    const g = Math.round(115 * shade);
    const b = Math.round(22 * shade);
    return `rgba(${r},${g},${b},${0.35+0.55*t})`;
  } else {
    const r = Math.round(59 * shade);
    const g = Math.round(130 * shade);
    const b = Math.round(246 * shade);
    return `rgba(${r},${g},${b},${0.35+0.55*(-t)})`;
  }
}

function draw3d(){
  const {g,w,h} = fit(c3);
  g.clearRect(0,0,w,h);
  g.fillStyle = css('--bg'); g.fillRect(0,0,w,h);

  // optical axis
  const a0 = project([0,0,0],w,h), a1 = project([0,0,D.biometry.axial_length_mm],w,h);
  g.strokeStyle = css('--line'); g.lineWidth = 1; g.setLineDash([5,4]);
  g.beginPath(); g.moveTo(a0[0],a0[1]); g.lineTo(a1[0],a1[1]); g.stroke(); g.setLineDash([]);

  // retinal shell: quads, shaded
  if(show.R){
    for(let m=0;m<D.shell.length;m++){
      const A = D.shell[m], B = D.shell[(m+1)%D.shell.length];
      for(let i=0;i<A.points.length-1;i++){
        const q3d = [A.points[i].p, A.points[i+1].p, B.points[i+1].p, B.points[i].p];
        const q = q3d.map(p=>project(p,w,h));
        
        // lighting calculation
        const shade = computeShading(q3d);
        
        g.beginPath(); g.moveTo(q[0][0],q[0][1]);
        for(let k=1;k<4;k++) g.lineTo(q[k][0],q[k][1]);
        g.closePath();
        g.fillStyle = rpreColour((A.points[i+1].rpre + B.points[i+1].rpre)/2, shade);
        g.fill();
        g.strokeStyle = css('--line'); g.lineWidth = .5; g.stroke();
      }
    }
  }

  // image shells as rings
  for(const which of ['T','S']){
    if(!show[which]) continue;
    g.strokeStyle = which==='T' ? css('--tan') : css('--sag');
    g.lineWidth = 2.0;
    for(let i=1;i<D.profile.length;i++){
      g.beginPath();
      for(let m=0;m<=D.shell.length;m++){
        const ring = D.shell[m % D.shell.length];
        const p = project(imageShellPoint(ring,i,which),w,h);
        m===0 ? g.moveTo(p[0],p[1]) : g.lineTo(p[0],p[1]);
      }
      g.closePath(); g.stroke();
    }
  }

  g.font='12px Outfit, sans-serif';
  const legend = [['망막면 — 색 = RPRE (3D 조명)', css('--muted')],
                  ['접선 상면 (Tangential)', css('--tan')], ['시상 상면 (Sagittal)', css('--sag')]];
  legend.forEach((l,i)=>{ g.fillStyle=l[1]; g.fillText(l[0], 12, 22+i*18); });
}

(function bind3d(){
  let drag=false, lx=0, ly=0;
  c3.addEventListener('pointerdown', e=>{drag=true;lx=e.clientX;ly=e.clientY;c3.setPointerCapture(e.pointerId);});
  c3.addEventListener('pointermove', e=>{
    if(!drag) return;
    rot.y += (e.clientX-lx)*0.01; rot.x += (e.clientY-ly)*0.01;
    rot.x = Math.max(-1.5, Math.min(1.5, rot.x));
    lx=e.clientX; ly=e.clientY; draw3d();
  });
  c3.addEventListener('pointerup', e=>{drag=false;});
  c3.addEventListener('wheel', e=>{e.preventDefault(); zoom *= e.deltaY>0?0.92:1.08;
    zoom=Math.max(.4,Math.min(4,zoom)); draw3d();}, {passive:false});
  const tog=(id,key)=>document.getElementById(id).addEventListener('click',ev=>{
    show[key]=!show[key]; ev.target.classList.toggle('on',show[key]); draw3d();});
  tog('bT','T'); tog('bS','S'); tog('bR','R');
  document.getElementById('bSpin').addEventListener('click',ev=>{
    spin=!spin; ev.target.classList.toggle('on',spin); if(spin) tick();});
  document.getElementById('bReset').addEventListener('click',()=>{
    rot={x:-0.35,y:0.65}; zoom=1; draw3d();});
  function tick(){ if(!spin) return; rot.y += 0.012; draw3d(); requestAnimationFrame(tick); }
})();

/* ---------- profile chart with interactive tooltip ---------- */
const cprof = document.getElementById('cprof');
let hoverIdx = -1;

function drawProfile(){
  const {g,w,h} = fit(cprof);
  g.clearRect(0,0,w,h); g.fillStyle=css('--bg'); g.fillRect(0,0,w,h);
  const pad={l:54,r:16,t:20,b:40};
  const xs = D.profile.map(p=>p.ecc);
  const series = [['rpre','RPRE (M−M0)',css('--accent')],
                  ['j0','J0',css('--tan')],
                  ['m','M',css('--muted')]];
  let lo=0, hi=0;
  series.forEach(s=>D.profile.forEach(p=>{lo=Math.min(lo,p[s[0]]);hi=Math.max(hi,p[s[0]]);}));
  
  // Also factor in the Navarro emmetropic reference curve
  // Navarro emmetropic reference: RPRE = -0.00083 * ecc^2
  xs.forEach(ecc => {
    const nav = -0.00083 * ecc * ecc;
    lo = Math.min(lo, nav);
    hi = Math.max(hi, nav);
  });

  const span = Math.max(0.6, hi-lo); lo-=span*0.12; hi+=span*0.12;
  const X = v => pad.l + (v-xs[0])/(xs[xs.length-1]-xs[0]) * (w-pad.l-pad.r);
  const Y = v => h-pad.b - (v-lo)/(hi-lo) * (h-pad.t-pad.b);

  // zero line
  g.strokeStyle=css('--line'); g.lineWidth=1;
  g.beginPath(); g.moveTo(pad.l,Y(0)); g.lineTo(w-pad.r,Y(0)); g.stroke();
  
  // Grid and labels
  g.fillStyle=css('--muted'); g.font='11px Outfit, Noto Sans KR, sans-serif';
  xs.forEach(v=>{ g.fillText(v+'°', X(v)-8, h-pad.b+18); });
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4;
    g.fillText(fmt(v,1), 6, Y(v)+4);
    g.strokeStyle=css('--line'); g.beginPath(); g.moveTo(pad.l,Y(v)); g.lineTo(w-pad.r,Y(v)); g.stroke(); }

  // Draw Navarro 1999 reference line (emmetropic standard)
  g.strokeStyle = '#ea580c'; g.lineWidth = 1.5; g.setLineDash([4, 4]);
  g.beginPath();
  D.profile.forEach((p, i) => {
    const nav = -0.00083 * p.ecc * p.ecc;
    const x = X(p.ecc), y = Y(nav);
    i ? g.lineTo(x,y) : g.moveTo(x,y);
  });
  g.stroke();
  g.setLineDash([]);
  g.fillStyle = '#ea580c';
  g.fillText('Navarro 1999 (정시안 기준)', w-pad.r-165, pad.t+5);

  // Series
  series.forEach((s,si)=>{
    g.strokeStyle=s[2]; g.lineWidth=si===0?2.8:1.8; g.beginPath();
    D.profile.forEach((p,i)=>{ const x=X(p.ecc), y=Y(p[s[0]]); i?g.lineTo(x,y):g.moveTo(x,y); });
    g.stroke();
    D.profile.forEach((p, i)=>{ 
      g.fillStyle=s[2]; g.beginPath(); 
      const radius = (i === hoverIdx) ? 5 : 3;
      g.arc(X(p.ecc),Y(p[s[0]]),radius,0,7); g.fill(); 
    });
    g.fillStyle=s[2]; g.fillText(s[1], w-pad.r-120, pad.t+20+si*16);
  });

  // Hover crosshair and tooltip box
  if (hoverIdx !== -1) {
    const p = D.profile[hoverIdx];
    const hX = X(p.ecc);
    
    // draw vertical line
    g.strokeStyle = css('--accent'); g.lineWidth = 1; g.setLineDash([2, 2]);
    g.beginPath(); g.moveTo(hX, pad.t); g.lineTo(hX, h-pad.b); g.stroke(); g.setLineDash([]);
    
    // draw tooltip card
    const boxW = 150, boxH = 95;
    let boxX = hX + 12;
    if (boxX + boxW > w - pad.r) {
      boxX = hX - boxW - 12;
    }
    const boxY = pad.t + 10;
    
    g.fillStyle = css('--panel');
    g.strokeStyle = css('--accent');
    g.lineWidth = 1.5;
    g.beginPath();
    g.roundRect(boxX, boxY, boxW, boxH, 8);
    g.fill();
    g.stroke();
    
    g.fillStyle = css('--ink');
    g.font = 'bold 11px Outfit, sans-serif';
    g.fillText(`편심: ${p.ecc}°`, boxX + 10, boxY + 18);
    g.font = '11px Outfit, sans-serif';
    g.fillStyle = css('--accent');
    g.fillText(`RPRE: ${fmt(p.rpre, 2)} D`, boxX + 10, boxY + 36);
    g.fillStyle = css('--tan');
    g.fillText(`J0: ${fmt(p.j0, 2)} D`, boxX + 10, boxY + 52);
    g.fillStyle = css('--muted');
    g.fillText(`M: ${fmt(p.m, 2)} D`, boxX + 10, boxY + 68);
    
    const nav = -0.00083 * p.ecc * p.ecc;
    g.fillStyle = '#ea580c';
    g.fillText(`Navarro: ${fmt(nav, 2)} D`, boxX + 10, boxY + 84);
  }
}

cprof.addEventListener('pointermove', e => {
  const rect = cprof.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const pad = {l:54, r:16};
  const w = rect.width;
  const xs = D.profile.map(p=>p.ecc);
  const minX = pad.l, maxX = w - pad.r;
  
  if (mouseX < minX || mouseX > maxX) {
    if (hoverIdx !== -1) { hoverIdx = -1; drawProfile(); }
    return;
  }
  
  // Find closest eccentricity index
  let closestDist = Infinity;
  let closestIdx = -1;
  xs.forEach((ecc, idx) => {
    const xPos = pad.l + (ecc-xs[0])/(xs[xs.length-1]-xs[0]) * (w-pad.l-pad.r);
    const dist = Math.abs(xPos - mouseX);
    if (dist < closestDist) {
      closestDist = dist;
      closestIdx = idx;
    }
  });
  
  if (closestIdx !== hoverIdx) {
    hoverIdx = closestIdx;
    drawProfile();
  }
});

cprof.addEventListener('pointerleave', () => {
  hoverIdx = -1;
  drawProfile();
});

/* ---------- meridional sketch ---------- */
const skKeys = Object.keys(D.sketches);
let skSel = skKeys[skKeys.length-1];
document.getElementById('skbtns').innerHTML = skKeys.map(k=>
  `<button data-k="${k}" class="${k===skSel?'on':''}">${k}°</button>`).join('');
document.getElementById('skbtns').addEventListener('click',e=>{
  if(!e.target.dataset.k) return;
  skSel = e.target.dataset.k;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle('on', b.dataset.k===skSel));
  drawSketch();
});

function drawSketch(){
  const S = D.sketches[skSel];
  const {g,w,h} = fit(document.getElementById('csk'));
  g.clearRect(0,0,w,h); g.fillStyle=css('--bg'); g.fillRect(0,0,w,h);
  
  // Set window margins
  let zmin=0, zmax=D.biometry.axial_length_mm + 2;
  let xmin=-10, xmax=10;
  
  const pad=24;
  const sc=Math.min((w-2*pad)/(zmax-zmin),(h-2*pad)/(xmax-xmin));
  const offsetZ=(w-(zmax-zmin)*sc)/2;
  const P=(z,x)=>[offsetZ+(z-zmin)*sc, h/2-(x-(xmin+xmax)/2)*sc];

  // Draw optical axis
  g.strokeStyle = css('--line'); g.lineWidth = 1; g.setLineDash([5, 5]);
  g.beginPath();
  const ax0 = P(zmin, 0), ax1 = P(zmax, 0);
  g.moveTo(ax0[0], ax0[1]); g.lineTo(ax1[0], ax1[1]);
  g.stroke(); g.setLineDash([]);

  // Draw refracting surfaces (Cornea & Lens contours)
  g.lineWidth = 1.5;
  D.sampled_surfaces.forEach(s => {
    g.strokeStyle = s.name.includes("cornea") ? '#0ea5e9' : '#10b981';
    g.beginPath();
    s.points.forEach((p, k) => {
      const q = P(p[0], p[1]);
      k ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]);
    });
    g.stroke();
  });

  // Draw retina contour (measured or fitted)
  g.strokeStyle = css('--muted'); g.lineWidth = 2.0;
  g.beginPath();
  const retPoints = D.retina_contour ? D.retina_contour : D.retina_fitted_contour;
  retPoints.forEach((p, k) => {
    const q = P(p[0], p[1]);
    k ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]);
  });
  g.stroke();

  // Draw Pupil / Iris aperture
  const pupilZ = D.biometry.acd_mm;
  const pupilRad = D.biometry.pupil_radius_mm;
  g.strokeStyle = '#ef4444'; g.lineWidth = 3;
  g.beginPath();
  const pTop0 = P(pupilZ, 8), pTop1 = P(pupilZ, pupilRad);
  const pBot0 = P(pupilZ, -pupilRad), pBot1 = P(pupilZ, -8);
  g.moveTo(pTop0[0], pTop0[1]); g.lineTo(pTop1[0], pTop1[1]);
  g.moveTo(pBot0[0], pBot0[1]); g.lineTo(pBot1[0], pBot1[1]);
  g.stroke();

  // Draw rays
  const cols=['#38bdf8','#10b981','#f59e0b','#a78bfa','#ef4444'];
  S.rays.forEach((r,i)=>{
    g.strokeStyle=cols[i%cols.length]; g.lineWidth=1.5; g.beginPath();
    r.forEach((p,k)=>{const q=P(p[0],p[1]); k?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);}); g.stroke();
  });

  // Focus and retina intersection
  const f=P(S.focus[0],S.focus[1]), rr=P(S.retina_hit[0],S.retina_hit[1]);
  g.strokeStyle=css('--hyper'); g.lineWidth=2;
  g.beginPath(); g.moveTo(f[0],f[1]); g.lineTo(rr[0],rr[1]); g.stroke();
  g.fillStyle=css('--hyper'); g.beginPath(); g.arc(f[0],f[1],4,0,7); g.fill();
  g.strokeStyle=css('--ink'); g.lineWidth=2;
  g.beginPath(); g.arc(rr[0],rr[1],4,0,7); g.stroke();

  // Legend inside canvas
  g.fillStyle = css('--muted'); g.font = '10px Outfit';
  g.fillText("하늘색: 각막 · 초록색: 수정체 · 회색: 망막 · 빨간색: 동공", pad, h - 10);

  document.getElementById('sknote').innerHTML =
    `입사각: <b>${skSel}°</b> · 초점→망막 거리: <b>${fmt(S.gap_mm,3)} mm</b> = <b>${fmt(S.defocus_d,3)} D</b>`;
}

/* ---------- Literature Panel Integration ---------- */
function initLiterature() {
  const grid = document.getElementById('litGrid');
  const detail = document.getElementById('litDetail');
  
  if (!D.literature || Object.keys(D.literature).length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 20px;">연동된 문헌 데이터가 없습니다.</div>';
    return;
  }
  
  const papers = Object.entries(D.literature);
  
  grid.innerHTML = papers.map(([id, p]) => `
    <div class="lit-card" data-id="${id}">
      <div>
        <div class="lit-title">${p.title}</div>
        <div class="lit-authors">${p.authors.slice(0, 3).join(', ')}${p.authors.length > 3 ? '외' : ''}</div>
      </div>
      <div class="lit-meta">
        <span>${p.journal.split(' ')[0]} (${p.year})</span>
        <span class="lit-citations">인용 ${p.citations}</span>
      </div>
    </div>
  `).join('');
  
  grid.addEventListener('click', e => {
    const card = e.target.closest('.lit-card');
    if (!card) return;
    
    // Set active style
    [...grid.children].forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    
    // Show details
    const id = card.dataset.id;
    const p = D.literature[id];
    
    document.getElementById('litDetailTitle').textContent = p.title;
    document.getElementById('litDetailAuthors').textContent = `저자: ${p.authors.join(', ')}`;
    document.getElementById('litDetailJournal').textContent = `학술지: ${p.journal} (${p.year}) | 인용 횟수: ${p.citations}`;
    document.getElementById('litDetailAbstract').innerHTML = `<b>초록:</b> ${p.abstract || '초록이 제공되지 않습니다.'}<br><br><b>연구 맥락:</b> ${p.desc}`;
    
    const link = document.getElementById('litDetailLink');
    if (p.doi) {
      link.setAttribute('href', p.doi);
      link.style.display = 'inline-flex';
    } else {
      link.removeAttribute('href');
      link.style.display = 'none';
    }
    
    detail.style.display = 'block';
    detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  
  // Select first paper by default
  if (grid.children.length > 0) {
    grid.children[0].click();
  }
}

function redraw(){ draw3d(); drawProfile(); drawSketch(); }
window.addEventListener('resize', redraw);

// Run init
initLiterature();
redraw();
</script>
